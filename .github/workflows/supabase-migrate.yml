name: Database migrations

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrate.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate Supabase production
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_URL_VARIABLE_PRESENT: ${{ vars.SUPABASE_DB_URL != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check production database secret
        id: database_secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            if [ "$SUPABASE_DB_URL_VARIABLE_PRESENT" = "true" ]; then
              echo "SUPABASE_DB_URL was found as an Environment variable, not a secret. Move it to Environment secrets."
            else
              echo "SUPABASE_DB_URL was not found in GitHub Environment Production secrets."
            fi
            echo "Add SUPABASE_DB_URL under GitHub Settings > Environments > Production > Environment secrets."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Install Supabase CLI
        if: steps.database_secret.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Preview pending migrations
        if: steps.database_secret.outputs.configured == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply pending migrations after merge
        if: steps.database_secret.outputs.configured == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Show migration status
        if: steps.database_secret.outputs.configured == 'true'
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
