name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:admin-users
      - run: npm run test:impersonation
      - run: npm run test:navigation-shell
      - run: npm run test:bootstrap
      - run: npm run test:if-undip-data
      - run: npm run test:rps-authoring
      - run: npm run test:rps-template
      - run: npm run test:superadmin-password
      - run: npm run test:teaching-navigation
      - name: Simulate Vercel adapter build
        run: NEXT_ADAPTER_PATH="$GITHUB_WORKSPACE/tests/fixtures/next-adapter-stub.cjs" npm run build:vercel

  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:standalone
      - name: Verify standalone server artifact
        run: test -f .next/standalone/server.js

  parser-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile services/parser/app/main.py
