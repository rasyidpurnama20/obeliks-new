name: Set superadmin password

run-name: Set primary superadmin password

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: set-superadmin-password
  cancel-in-progress: false

jobs:
  set-password:
    name: Confirm and activate superadmin
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check required secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPERADMIN_INITIAL_PASSWORD: ${{ secrets.SUPERADMIN_INITIAL_PASSWORD }}
          SUPERADMIN_PASSWORD_VARIABLE_PRESENT: ${{ vars.SUPERADMIN_INITIAL_PASSWORD != '' }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY under the Production environment secrets."
            exit 1
          fi
          if [ -z "$SUPERADMIN_INITIAL_PASSWORD" ]; then
            if [ "$SUPERADMIN_PASSWORD_VARIABLE_PRESENT" = "true" ]; then
              echo "Move SUPERADMIN_INITIAL_PASSWORD from an Environment variable to an Environment secret."
            fi
            echo "Add SUPERADMIN_INITIAL_PASSWORD under the Production environment secrets."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Set the primary superadmin password
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPERADMIN_INITIAL_PASSWORD: ${{ secrets.SUPERADMIN_INITIAL_PASSWORD }}
          SUPERADMIN_EMAIL: rasyid.purnama20@gmail.com
        run: node scripts/set-superadmin-password.mjs
